services:
  db:
    image: postgres:17.7
    environment:
      POSTGRES_USER: nycap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: nycap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nycap_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nycap -d nycap"]
      interval: 5s
      retries: 10
volumes:
  nycap_pg:
